# Disposable local rehearsal overrides. Never use against the live project.
# Run with explicit -f arguments on Windows.
services:
  moodle:
    ports: !override
      - "127.0.0.1:8081:8080"
    environment:
      SITE_URL: http://127.0.0.1:8081
      REVERSEPROXY: "true"
      SSLPROXY: "false"

networks:
  jobe:
    ipam:
      # Replace the live subnet so both projects can run at the same time.
      config: !override
        - subnet: 100.64.101.0/24
